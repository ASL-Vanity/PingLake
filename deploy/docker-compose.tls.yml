services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      PINGLAKE_DOMAIN: ${PINGLAKE_DOMAIN:?set PINGLAKE_DOMAIN in .env before enabling TLS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
