[package]
name = "pinglake-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
pinglake-protocol = { path = "../protocol" }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
surge-ping = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Performance", "Win32_System_Services", "Win32_Security", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"
